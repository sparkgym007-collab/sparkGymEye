plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.sparkgymeye'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('migrateDatabase', JavaExec) {
    group = 'database'
    description = 'Runs Flyway migrations using DATABASE_URL, DATABASE_USERNAME, and DATABASE_PASSWORD.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.sparkgymeye.api.database.DatabaseMigrator'
}

tasks.register('repairDatabase', JavaExec) {
    group = 'database'
    description = 'Repairs Flyway schema history checksums using DATABASE_URL, DATABASE_USERNAME, and DATABASE_PASSWORD.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.sparkgymeye.api.database.DatabaseRepairer'
}
