spring:
  application:
    name: sparkgymeye-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:sparkgymeye;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${PORT:9898}

spark:
  reports:
    overdue-cron: ${OVERDUE_REPORT_CRON:0 0 10 ? * THU}
    recipient-email: ${REPORT_RECIPIENT_EMAIL:owner@sparkgym.in}
    cc-email: ${REPORT_CC_EMAIL:trainer@sparkgym.in}
